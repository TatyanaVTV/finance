spring:
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true      # проверять контрольные суммы при старте
    out-of-order: false            # запретить миграции с меньшей версией
  jackson:
    serialization:
      fail-on-empty-beans: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false # страницы с нуля (page=0 — первая)
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m,recordStats
  datasource:
    driver-class-name: org.postgresql.Driver
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    path: /error

logging:
  level:
    ru.vtvhw.spring.finance: INFO