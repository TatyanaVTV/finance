<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>

<div class="container mt-4">
    <h1>Дашборд</h1>

    <div class="row">
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Доходы</h5>
                    <p class="card-text h3" th:text="${income}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-danger mb-3">
                <div class="card-body">
                    <h5 class="card-title">Расходы</h5>
                    <p class="card-text h3" th:text="${expense}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-info mb-3">
                <div class="card-body">
                    <h5 class="card-title">Баланс</h5>
                    <p class="card-text h3" th:text="${balance}"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <canvas id="chart" width="400" height="200"></canvas>
        </div>
        <div class="col-md-4">
            <h5>Последние транзакции</h5>
            <ul class="list-group">
                <li class="list-group-item" th:each="t : ${transactions}">
                    <span th:text="${#temporals.format(t.date, 'dd.MM.yyyy HH:mm')}"></span>:
                    <span th:text="${t.amount}"></span>
                    (<span th:if="${t.type != null}"
                           th:text="${t.type.value}"
                           th:class="${t.type.name() == 'INCOME'} ? 'income-type' : 'expense-type'"></span>
                    <span th:unless="${t.type != null}" class="unknown-type">—</span>)
                </li>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/dashboard.js"></script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
