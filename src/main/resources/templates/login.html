<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div class="container mt-4">
    <h1 class="text-center" style="color: #2e7d32;">Финансовый мониторинг</h1>
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center">Вход</h2>

            <!-- Блок ошибки (неверный логин/пароль) -->
            <div th:if="${param.error}" class="alert alert-danger">
                Неверный email или пароль
            </div>

            <!-- Блок сообщения об успешной регистрации -->
            <div th:if="${param.registered}" class="alert alert-success">
                Регистрация прошла успешно. Войдите в систему.
            </div>

            <!-- Блок сообщения о выходе -->
            <div th:if="${param.logout}" class="alert alert-info">
                Вы вышли из системы.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input type="email" id="username" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Войти</button>
            </form>
            <p class="mt-3 text-center">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
