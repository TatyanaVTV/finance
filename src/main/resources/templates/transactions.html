<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>

<div class="container mt-4">
    <h1>Транзакции</h1>

    <!-- Блок отображения ошибки -->
    <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>

    <!-- Форма добавления -->
    <form th:action="@{/transactions}" method="post" th:object="${newTransaction}">
        <div class="row g-3 align-items-end">
            <div class="col-md-2">
                <label for="amount" class="form-label">Сумма</label>
                <input type="number" step="0.01" th:field="*{amount}" class="form-control" id="amount" placeholder="Сумма" required>
            </div>
            <div class="col-md-2">
                <label for="addType" class="form-label">Тип</label>
                <select th:field="*{type}" class="form-select" id="addType">
                    <option value="INCOME">Доход</option>
                    <option value="EXPENSE">Расход</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="addCategory" class="form-label">Категория</label>
                <select th:field="*{categoryId}" class="form-select" id="addCategory">
                    <!-- Заполняется через JS -->
                </select>
            </div>
            <div class="col-md-2">
                <label for="addDate" class="form-label">Дата</label>
                <input type="datetime-local" class="form-control" id="addDate"
                       name="date" th:value="${formattedDate}">
            </div>
            <div class="col-md-2">
                <label for="addDesc" class="form-label">Описание</label>
                <input type="text" th:field="*{description}" class="form-control" id="addDesc" placeholder="Описание" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Добавить</button>
            </div>
        </div>
    </form>

    <!-- Таблица транзакций -->
    <table class="table table-striped mt-3" id="transactionTable">
        <thead>
        <tr>
            <th>Дата</th>
            <th>Категория</th>
            <th>Тип</th>
            <th>Сумма</th>
            <th>Описание</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="transactionTableBody">
        <tr th:each="t : ${transactions}" th:data-id="${t.id}" class="transaction-row">
            <td class="display-date" th:text="${#temporals.format(t.date, 'dd.MM.yyyy HH:mm:ss')}"></td>
            <td class="display-category" th:text="${t.categoryName}"></td>
            <td class="display-type">
                    <span th:switch="${t.type}">
                        <span th:case="'INCOME'" style="color: darkgreen; font-weight: bold;">Доход</span>
                        <span th:case="'EXPENSE'" style="color: darkred; font-weight: bold;">Расход</span>
                    </span>
            </td>
            <td class="display-amount" th:text="${t.amount}"></td>
            <td class="display-description" th:text="${t.description}"></td>
            <td>
                <button class="btn btn-sm btn-primary edit-btn" data-id="${t.id}">Редактировать</button>
                <button class="btn btn-sm btn-danger delete-btn" data-id="${t.id}">Удалить</button>
            </td>
        </tr>
        <!-- Шаблон для редактирования (скрыт) -->
        <tr id="editTemplate" style="display:none;">
            <td><input type="datetime-local" class="form-control edit-date"></td>
            <td>
                <select class="form-select edit-category"></select>
            </td>
            <td>
                <select class="form-select edit-type">
                    <option value="INCOME">Доход</option>
                    <option value="EXPENSE">Расход</option>
                </select>
            </td>
            <td><input type="number" step="0.01" class="form-control edit-amount"></td>
            <td><input type="text" class="form-control edit-description"></td>
            <td>
                <button class="btn btn-sm btn-success save-edit-btn" data-id="">Сохранить</button>
                <button class="btn btn-sm btn-secondary cancel-edit-btn">Отмена</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Передаём категории и выбранный ID из модели в JavaScript -->
<script th:inline="javascript">
    /*<![CDATA[*/
    var categories = /*[[${categories}]]*/ [];
    var selectedCategoryId = /*[[${newTransaction != null ? newTransaction.categoryId : null}]]*/ null;
    /*]]>*/
</script>

<!-- Наш скрипт -->
<script src="/js/transactions.js"></script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
